<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Senai - CSS Grid Layout</title>
    <link rel="stylesheet" href="_css/main.css">
    <link rel="shortcut icon" href="_imagens/favicon.ico">
</head>
<body>
    <div class="grid-container">
        <!-- Logo -->
         <div class="area_0">
            <img src="_imagens/logo-senai.png" alt="Logo do Senai" width="200">
         </div>

    <!-- Cabeçalho -->
     <div class="area_1">
        <div class="menu">
            <ul>
                <li><a href="#">Cursos Senai</a></li>
                <li><a href="#">Institucional</a></li>
                <li><a href="#">Serviços de Tecnologia</a></li>
                <li><a href="#">Transparência</a></li>
            </ul>
        </div>
     </div>
     <!-- Busca -->
     <div class="area_2">
        <div class="input-group input-group-lg">
            <span class="input-group-text" id="input-group-sizing-lg">Faça a pesquisa</span>
            <input type="text" class="form-control" placeholder="Digite aqui o que você quer...">
            <button type="button" class="btn btn-success">Buscar</button>
        </div>
     </div>

    </div>

</body>
</html>
